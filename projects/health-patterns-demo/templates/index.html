{% extends "base.html" %}{% block form %}<fieldset><legend>Fictional binary features</legend>{% for feature in features %}<label><input style="width:auto" type="checkbox" name="symptom" value="{{ feature }}" {% if feature in selected %}checked{% endif %}> {{ feature.replace('_',' ').title() }}</label>{% endfor %}</fieldset><label for="topic">Educational FAQ</label><select id="topic" name="topic">{% for key in ['about','privacy','help'] %}<option {% if key == topic %}selected{% endif %}>{{ key }}</option>{% endfor %}</select>{% endblock %}
